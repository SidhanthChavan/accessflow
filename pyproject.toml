[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessflow"
version = "1.0.0"
description = "Automated Joiner-Mover-Leaver access management: HR feed + policy-as-code -> safe, audited access changes across AWS, GitHub, Slack and Google Workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sidhanth Chavan" }]
keywords = ["identity", "iam", "automation", "access-management", "devsecops", "aws", "compliance"]
dependencies = [
  "boto3>=1.34",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "moto[iam]>=5.0", "ruff>=0.6"]

[project.scripts]
accessflow = "accessflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessflow = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
