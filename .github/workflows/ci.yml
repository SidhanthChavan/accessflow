name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest --cov=accessflow --cov-report=term-missing --cov-fail-under=90

  policy-plan:
    # Every pull request that changes the policy shows exactly what access would change.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/seed_demo.py
      - run: accessflow plan --hr data/hr_feed.csv --policy config/policy.yaml --today 2026-11-19 --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: access-plan
          path: reports/
